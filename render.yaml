services:
  - type: web
    name: pelada
    runtime: docker
    plan: free
    region: virginia
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: JDBC_DATABASE_URL
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: PUBLIC_APP_URL
        sync: false
      - key: COOKIE_SECURE
        value: "true"
      - key: DEMO_ENABLED
        value: "true"
