services:
  - type: web
    name: pelada
    runtime: docker
    plan: free
    region: virginia
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: WHATSAPP_ENABLED
        sync: false
      - key: WHATSAPP_BUSINESS_NUMBER
        sync: false
      - key: WHATSAPP_PHONE_ID
        sync: false
      - key: WHATSAPP_APP_SECRET
        sync: false
      - key: WHATSAPP_VERIFY_TOKEN
        sync: false
      - key: JDBC_DATABASE_URL
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: PUBLIC_APP_URL
        sync: false
      - key: ASSISTANT_ENABLED
        sync: false
      - key: ASSISTANT_API_KEY
        sync: false
      - key: ASSISTANT_MODEL
        sync: false
      - key: ASSISTANT_DAILY_LIMIT
        sync: false
      - key: COOKIE_SECURE
        value: "true"
      - key: DEMO_ENABLED
        value: "true"
