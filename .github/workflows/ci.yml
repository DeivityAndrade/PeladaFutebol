name: Verificações
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: pelada_test
          POSTGRES_USER: pelada
          POSTGRES_PASSWORD: pelada
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pelada -d pelada_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: jdbc:postgresql://localhost:5432/pelada_test
      TEST_DB_USER: pelada
      TEST_DB_PASSWORD: pelada
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --global pnpm@11.19.0
      - run: pnpm install --frozen-lockfile && pnpm build
        working-directory: frontend
      - run: mvn -B -ntp -f backend/pom.xml verify
      - run: |
          PGPASSWORD=pelada psql -h localhost -U pelada -d pelada_test -c 'CREATE DATABASE pelada_e2e;'
          JDBC_DATABASE_URL=jdbc:postgresql://localhost:5432/pelada_e2e java -jar backend/target/pelada-1.0.0.jar > backend.log 2>&1 &
          for i in $(seq 1 60); do curl -fsS http://localhost:8080/api/health && break; sleep 2; done
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: frontend
      - run: pnpm test:e2e
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: evidencias-de-falha
          path: |
            frontend/test-results
            backend.log
