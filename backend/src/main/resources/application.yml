server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
  servlet:
    session:
      timeout: 4h
      cookie:
        http-only: true
        secure: ${COOKIE_SECURE:false}
        same-site: lax
spring:
  application:
    name: pelada
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 3MB
  datasource:
    url: ${JDBC_DATABASE_URL:jdbc:postgresql://localhost:5432/pelada}
    username: ${DB_USER:pelada}
    password: ${DB_PASSWORD:pelada}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 0
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  session:
    jdbc:
      initialize-schema: never
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  mvc:
    problemdetails:
      enabled: true
springdoc:
  swagger-ui:
    path: /api/docs
  api-docs:
    path: /api/openapi
app:
  demo-enabled: ${DEMO_ENABLED:true}
  mail-from: ${MAIL_FROM:}
  public-app-url: ${PUBLIC_APP_URL:}
