server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
  servlet:
    session:
      timeout: 4h
      cookie:
        http-only: true
        secure: ${COOKIE_SECURE:false}
        same-site: lax
spring:
  application:
    name: pelada
  datasource:
    url: ${JDBC_DATABASE_URL:jdbc:postgresql://localhost:5432/pelada}
    username: ${DB_USER:pelada}
    password: ${DB_PASSWORD:pelada}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 0
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  session:
    jdbc:
      initialize-schema: never
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  mvc:
    problemdetails:
      enabled: true
springdoc:
  swagger-ui:
    path: /api/docs
  api-docs:
    path: /api/openapi
app:
  demo-enabled: ${DEMO_ENABLED:true}
